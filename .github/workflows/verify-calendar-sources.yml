name: Verify calendar sources

# calendar.json's provenance (src/nepkit/data/DATA.md) rests on a diff against
# two upstream tables that was run once, by hand. This reruns it on a schedule
# instead, via scripts/verify_calendar_sources.py, so a later revision to
# either upstream table gets caught here rather than staying invisible until
# someone thinks to redo the sourcing document.
#
# A scheduled-workflow failure emails whoever the run's actor would be (the
# user who last edited the workflow) -- no extra notification wiring needed.

on:
  schedule:
    # GitHub warns against scheduling at the top of the hour, when load is
    # highest and runs are likeliest to be delayed -- an arbitrary offset
    # avoids that. Monthly is frequent enough for a table that changes at
    # most a few times a year, if ever.
    - cron: "23 7 3 * *" # 07:23 UTC on the 3rd of each month
  workflow_dispatch:

permissions: {}

env:
  UV_FROZEN: "1"

jobs:
  verify:
    name: Diff calendar.json against upstream sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group dev

      - name: Verify
        run: uv run python scripts/verify_calendar_sources.py

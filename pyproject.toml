[project]
authors = [{name = "Kritagya"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.15,<0.28",
  # CPython ships no readline on Windows, which cost the REPL its Up/Down
  # history. pyreadline3 supplies a `readline` module there, so cli.py's plain
  # `import readline` starts succeeding and needs no platform branch. The
  # marker keeps every other platform's install unchanged.
  "pyreadline3>=3.5; sys_platform == 'win32'",
]
description = "Typed Bikram Sambat ↔ Gregorian date conversion, as a library and a CLI."
keywords = ["nepal", "bikram-sambat", "nepali-date", "calendar", "cli"]
license = "MIT"
license-files = ["LICENSE"]
name = "nepkit"
readme = "README.md"
requires-python = ">=3.12"
version = "0.2.0"

[project.urls]
Homepage = "https://github.com/akakritagya/nepkit"
Issues = "https://github.com/akakritagya/nepkit/issues"
Repository = "https://github.com/akakritagya/nepkit"

[project.scripts]
nepkit = "nepkit.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff==0.16.1",
  "mypy==2.3.0",
  "pre-commit>=4.6.1,<5",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.1,<0.13.0"]

[tool.ruff]
indent-width = 4
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests document intent through names and assertions, not docstrings.
"tests/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nepkit"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError"]
show_missing = true

[tool.mypy]
files = ["src", "tests"]
python_executable = ".venv/bin/python"
python_version = "3.12"
strict = true

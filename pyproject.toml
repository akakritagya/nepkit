[project]
name = "nepkit"
version = "0.1.0"
description = "Nepal-specific developer utilities — Bikram Sambat dates, currency, units."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kritagya" }]
keywords = ["nepal", "bikram-sambat", "nepali-date", "cli"]
dependencies = [
    "typer>=0.12,<0.28",
]

[project.scripts]
nepkit = "nepkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=2.3,<3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
python_executable = ".venv/bin/python"
strict = true
files = ["src", "tests"]